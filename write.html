<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>글쓰기</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: #fff;
            font-family: 'Pretendard', sans-serif;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 350px;
            background: #1c1c1c;
            border: none;
            border-radius: 16px;
            padding: 15px;
            font-size: 16px;
            color: #fff;
            outline: none;
        }

        .btn {
            margin-top: 15px;
            width: 100%;
            padding: 15px;
            background: #ffffff20;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <h2>글 작성</h2>

    <textarea placeholder="여기에 글을 입력하세요..."></textarea>

    <div class="btn" onclick="alert('작성 완료! (DB 연결 가능)')">작성 완료</div>

</body>
</html>
