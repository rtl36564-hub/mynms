<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 정보 소개</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      width: 350px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ccc;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #444;
    }
    .contact {
      margin-top: 20px;
      font-size: 14px;
      color: #0077cc;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="profile-img"></div>
    <h1>이민수</h1>
    <p>안녕하세요! 저는 웹사이트 만들기를 배우고 있는 사용자입니다.<br>
    간단한 소개 페이지를 만들고 있습니다 :)</p>
    <div class="contact">📧 minso099@gmail.com</div>
  </div>
</body>
</html>
