<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>나의 웹사이트 - 소개</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #e7f0ff, #f8faff);
            margin: 0;
            padding: 0;
        }

        /* 중앙 카드 */
        .card {
            background: white;
            max-width: 420px;
            margin: 80px auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            animation: fadeIn 0.7s ease;
        }

        /* 프로필 이미지 */
        .profile {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #f0f0f0;
            box-shadow: 0 5px 12px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
            margin-top: 20px;
            font-weight: 600;
            color: #333;
        }

        p {
            font-size: 15px;
            color: #555;
            line-height: 1.6;
        }

        /* 버튼 */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #4e73df;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.2s;
            font-weight: 500;
        }

        .btn:hover {
            background: #3b5ac6;
        }

        /* 애니메이션 */
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(15px);}
            to {opacity: 1; transform: translateY(0);}
        }

    </style>
</head>

<body>
    <div class="card">
        <img src="https://via.placeholder.com/150" alt="me" class="profile">
        <h1>👋 안녕하세요!</h1>
        <p>이곳은 제가 처음 만든 개인 웹사이트입니다.<br>
           웹 개발을 배우기 시작했고, 점점 더 멋지게 만들어갈 예정이에요!</p>

        <a href="#" class="btn">더 알아보기</a>
    </div>
</body>
</html>
